  <rect x="110" y="80"  width="35" height="6" rx="1" fill="rgba(97,175,239,0.6)"/>
  <rect x="149" y="80"  width="15" height="6" rx="1" fill="rgba(255,255,255,0.4)"/>
  <rect x="168" y="80"  width="45" height="6" rx="1" fill="rgba(152,195,121,0.6)"/>

  <rect x="96"  y="91"  width="22" height="6" rx="1" fill="rgba(229,192,123,0.65)"/>
  <rect x="122" y="91"  width="14" height="6" rx="1" fill="rgba(255,255,255,0.45)"/>
  <rect x="140" y="91"  width="48" height="6" rx="1" fill="rgba(152,195,121,0.55)"/>
  <rect x="192" y="91"  width="22" height="6" rx="1" fill="rgba(97,175,239,0.45)"/>

  <rect x="96"  y="102" width="30" height="6" rx="1" fill="rgba(97,175,239,0.55)"/>
  <rect x="130" y="102" width="18" height="6" rx="1" fill="rgba(255,255,255,0.38)"/>
  <rect x="152" y="102" width="38" height="6" rx="1" fill="rgba(229,192,123,0.48)"/>

  <rect x="96"  y="113" width="16" height="6" rx="1" fill="rgba(198,120,221,0.55)"/>
  <rect x="116" y="113" width="55" height="6" rx="1" fill="rgba(255,255,255,0.3)"/>


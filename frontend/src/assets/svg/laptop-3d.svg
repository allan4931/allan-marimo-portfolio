  <!-- Lid right edge -->
  <path d="M338 50 L342 60 L342 210 L338 212Z" fill="#141414"/>
  <!-- Lid top edge -->
  <path d="M66 48 L58 54" stroke="#222" stroke-width="1" fill="none"/>
  <path d="M334 48 L342 54" stroke="#181818" stroke-width="1" fill="none"/>
  <!-- Lid top (back) edge -->
  <path d="M58 54 L342 54" stroke="rgba(255,255,255,0.06)" stroke-width="1" fill="none"/>

  <!-- Screen bezel (inner) -->

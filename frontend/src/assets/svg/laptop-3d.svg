  <circle cx="91" cy="64" r="4" fill="rgba(255,95,86,0.7)"/>
  <circle cx="103" cy="64" r="4" fill="rgba(254,188,46,0.7)"/>
  <circle cx="115" cy="64" r="4" fill="rgba(40,200,64,0.7)"/>

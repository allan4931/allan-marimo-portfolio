  <rect x="90"  y="234" width="7"  height="5" rx="1" fill="rgba(255,255,255,0.06)"/>
  <rect x="101" y="234" width="7"  height="5" rx="1" fill="rgba(255,255,255,0.06)"/>
  <rect x="112" y="234" width="7"  height="5" rx="1" fill="rgba(255,255,255,0.06)"/>
  <rect x="123" y="234" width="7"  height="5" rx="1" fill="rgba(255,255,255,0.06)"/>
  <rect x="258" y="234" width="7"  height="5" rx="1" fill="rgba(255,255,255,0.06)"/>
  <rect x="269" y="234" width="7"  height="5" rx="1" fill="rgba(255,255,255,0.06)"/>
  <rect x="280" y="234" width="7"  height="5" rx="1" fill="rgba(255,255,255,0.06)"/>
  <rect x="291" y="234" width="7"  height="5" rx="1" fill="rgba(255,255,255,0.06)"/>
  <rect x="302" y="234" width="7"  height="5" rx="1" fill="rgba(255,255,255,0.06)"/>
  <rect x="313" y="234" width="9"  height="5" rx="1" fill="rgba(255,255,255,0.06)"/>
  <!-- Spacebar -->
  <rect x="146" y="243" width="108" height="5" rx="2" fill="rgba(255,255,255,0.06)"/>

  <!-- ── LID / SCREEN ── -->
  <!-- Hinge area -->
  <path d="M60 218 L64 215 L336 215 L340 218Z" fill="#1e1e1e"/>

  <!-- Lid outer face (back face, slight 3D) -->

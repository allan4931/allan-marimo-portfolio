  <rect x="88"  y="124" width="26" height="6" rx="1" fill="rgba(97,175,239,0.45)"/>
  <rect x="118" y="124" width="40" height="6" rx="1" fill="rgba(152,195,121,0.45)"/>
  <rect x="161" y="123" width="1.5" height="8" rx="1" fill="rgba(212,175,55,0.9)"/>

  <rect x="88"  y="135" width="72" height="6" rx="1" fill="rgba(255,255,255,0.16)"/>
  <rect x="88"  y="146" width="42" height="6" rx="1" fill="rgba(229,192,123,0.4)"/>
  <rect x="134" y="146" width="28" height="6" rx="1" fill="rgba(255,255,255,0.25)"/>

  <!-- Right panel: file tree -->
  <rect x="272" y="72" width="44" height="128" rx="0" fill="rgba(255,255,255,0.015)"/>
  <rect x="276" y="76" width="8"  height="6" rx="1" fill="rgba(212,175,55,0.4)"/>
  <rect x="288" y="76" width="24" height="6" rx="1" fill="rgba(255,255,255,0.15)"/>
  <rect x="280" y="86" width="28" height="5" rx="1" fill="rgba(255,255,255,0.1)"/>
  <rect x="280" y="95" width="22" height="5" rx="1" fill="rgba(152,195,121,0.35)"/>
  <rect x="280" y="104" width="26" height="5" rx="1" fill="rgba(255,255,255,0.1)"/>
  <rect x="280" y="113" width="18" height="5" rx="1" fill="rgba(97,175,239,0.35)"/>
  <rect x="280" y="122" width="24" height="5" rx="1" fill="rgba(255,255,255,0.1)"/>
  <rect x="280" y="131" width="20" height="5" rx="1" fill="rgba(255,255,255,0.1)"/>

  <!-- Status bar -->
  <rect x="78"  y="196" width="244" height="10" rx="0" fill="rgba(97,175,239,0.12)"/>
  <rect x="84"  y="198" width="48" height="5"  rx="1" fill="rgba(255,255,255,0.18)"/>
  <rect x="280" y="198" width="36" height="5"  rx="1" fill="rgba(212,175,55,0.4)"/>

  <!-- Apple / brand logo hint on lid back -->
  <circle cx="200" cy="130" r="20" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Screen outer glow (ambient) -->
  <ellipse cx="200" cy="131" rx="140" ry="90" fill="rgba(79,195,247,0.04)"/>

  <!-- Lid highlight top -->
  <path d="M70 50 L330 50" stroke="rgba(255,255,255,0.07)" stroke-width="1" fill="none"/>
  <!-- Lid left highlight -->
  <path d="M62 50 L60 212" stroke="rgba(212,175,55,0.12)" stroke-width="1" fill="none"/>
</svg>

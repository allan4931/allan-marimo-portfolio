  <!-- Base front edge (3D depth) -->
  <path d="M56 248 L60 272 L340 272 L344 248Z" fill="url(#baseEdge)"/>
  <!-- Base side left edge -->
  <path d="M52 230 L56 248 L60 272 L54 260 L48 238Z" fill="#1a1a1a"/>
  <!-- Base side right edge -->
  <path d="M348 230 L344 248 L340 272 L346 260 L352 238Z" fill="#141414"/>
  <!-- Touchpad -->
  <path d="M164 228 Q164 222 180 220 L220 220 Q236 222 236 228 L234 244 Q234 248 218 248 L182 248 Q166 248 166 244Z" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <!-- Base top surface highlight -->
  <path d="M66 220 L334 220" stroke="rgba(255,255,255,0.08)" stroke-width="1" fill="none"/>
  <!-- Base edge top highlight -->
  <path d="M60 272 L340 272" stroke="rgba(255,255,255,0.05)" stroke-width="1" fill="none"/>
  <!-- Keyboard area -->
  <!-- Key rows on base -->
  <rect x="76"  y="225" width="7" height="5" rx="1" fill="rgba(255,255,255,0.07)"/>
  <rect x="87"  y="225" width="7" height="5" rx="1" fill="rgba(255,255,255,0.07)"/>
  <rect x="98"  y="225" width="7" height="5" rx="1" fill="rgba(255,255,255,0.07)"/>
  <rect x="109" y="225" width="7" height="5" rx="1" fill="rgba(212,175,55,0.25)"/>
  <rect x="120" y="225" width="7" height="5" rx="1" fill="rgba(255,255,255,0.07)"/>
  <rect x="131" y="225" width="7" height="5" rx="1" fill="rgba(255,255,255,0.07)"/>
  <rect x="248" y="225" width="7" height="5" rx="1" fill="rgba(255,255,255,0.07)"/>
  <rect x="259" y="225" width="7" height="5" rx="1" fill="rgba(255,255,255,0.07)"/>
  <rect x="270" y="225" width="7" height="5" rx="1" fill="rgba(255,255,255,0.07)"/>
  <rect x="281" y="225" width="7" height="5" rx="1" fill="rgba(255,255,255,0.07)"/>
  <rect x="292" y="225" width="7" height="5" rx="1" fill="rgba(255,255,255,0.07)"/>
  <rect x="303" y="225" width="7" height="5" rx="1" fill="rgba(255,255,255,0.07)"/>
  <rect x="314" y="225" width="7" height="5" rx="1" fill="rgba(255,255,255,0.07)"/>

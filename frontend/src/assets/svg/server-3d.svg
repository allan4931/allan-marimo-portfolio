<svg viewBox="0 0 360 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="srv1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#111"/>
    </linearGradient>
    <linearGradient id="srv1side" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <linearGradient id="srv1top" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="100%" stop-color="#222"/>
    </linearGradient>
    <radialGradient id="led-green" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#28c840"/>
      <stop offset="100%" stop-color="#0d5c1a"/>
    </radialGradient>
    <radialGradient id="led-gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#7a6215"/>
    </radialGradient>
    <radialGradient id="led-blue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4FC3F7"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </radialGradient>
    <radialGradient id="cloudGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background glow -->
  <ellipse cx="180" cy="160" rx="160" ry="140" fill="url(#cloudGlow)"/>

  <!-- ── SERVER RACK (3D isometric-ish) ── -->

  <!-- RACK CABINET back panel -->
  <path d="M80 60 L280 60 L280 280 L80 280Z" fill="#0e0e0e" stroke="rgba(212,175,55,0.08)" stroke-width="1"/>

  <!-- Rack top face (3D) -->
  <path d="M80 60 L110 38 L310 38 L280 60Z" fill="#1a1a1a"/>
  <!-- Rack right side face -->
  <path d="M280 60 L310 38 L310 258 L280 280Z" fill="#0a0a0a"/>

  <!-- Rack frame highlights -->
  <path d="M80 60 L80 280" stroke="rgba(212,175,55,0.15)" stroke-width="1.5" fill="none"/>
  <path d="M280 60 L280 280" stroke="rgba(255,255,255,0.05)" stroke-width="1" fill="none"/>
  <path d="M80 60 L280 60" stroke="rgba(212,175,55,0.1)" stroke-width="1" fill="none"/>

  <!-- ── SERVER UNIT 1 (top) ── -->
  <!-- Front face -->
  <rect x="88" y="68" width="184" height="38" rx="2" fill="url(#srv1)"/>
  <rect x="88" y="68" width="184" height="38" rx="2" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <!-- Server top face (3D) -->
  <path d="M88 68 L106 56 L290 56 L272 68Z" fill="url(#srv1top)"/>
  <!-- Server right face -->
  <path d="M272 68 L290 56 L290 94 L272 106Z" fill="url(#srv1side)"/>
  <!-- Unit highlight -->
  <path d="M90 70 L270 70" stroke="rgba(255,255,255,0.08)" stroke-width="0.5" fill="none"/>
  <!-- Power button -->
  <circle cx="102" cy="87" r="6" fill="#1e1e1e" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <circle cx="102" cy="87" r="3" fill="url(#led-green)" filter="url(#glow)"/>
  <!-- Drive bays -->
  <rect x="115" y="75" width="20" height="26" rx="2" fill="#1a1a1a" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <rect x="140" y="75" width="20" height="26" rx="2" fill="#1a1a1a" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <rect x="165" y="75" width="20" height="26" rx="2" fill="#1c1c1c" stroke="rgba(212,175,55,0.2)" stroke-width="0.5"/>
  <!-- Drive bay LEDs -->
  <circle cx="125" cy="79" r="2" fill="url(#led-green)" filter="url(#glow)"/>
  <circle cx="150" cy="79" r="2" fill="url(#led-gold)" filter="url(#glow)"/>
  <circle cx="175" cy="79" r="2" fill="url(#led-green)" filter="url(#glow)"/>
  <!-- Status panel -->
  <rect x="198" y="75" width="66" height="26" rx="2" fill="#111" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <rect x="202" y="79" width="58" height="8" rx="1" fill="rgba(79,195,247,0.12)"/>
  <text x="204" y="86" font-family="monospace" font-size="5" fill="rgba(79,195,247,0.8)">CPU: 14%  RAM: 3.2G</text>
  <rect x="202" y="90" width="40" height="5" rx="1" fill="rgba(152,195,121,0.18)"/>
  <text x="204" y="95" font-family="monospace" font-size="4" fill="rgba(152,195,121,0.7)">ONLINE  ●</text>
  <!-- Ports -->
  <rect x="240" y="82" width="8" height="6" rx="1" fill="#0d0d0d" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <rect x="252" y="82" width="8" height="6" rx="1" fill="#0d0d0d" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>

  <!-- ── SERVER UNIT 2 ── -->
  <rect x="88" y="114" width="184" height="38" rx="2" fill="url(#srv1)"/>
  <rect x="88" y="114" width="184" height="38" rx="2" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <path d="M88 114 L106 102 L290 102 L272 114Z" fill="url(#srv1top)"/>
  <path d="M272 114 L290 102 L290 140 L272 152Z" fill="url(#srv1side)"/>
  <path d="M90 116 L270 116" stroke="rgba(255,255,255,0.07)" stroke-width="0.5" fill="none"/>
  <circle cx="102" cy="133" r="6" fill="#1e1e1e" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <circle cx="102" cy="133" r="3" fill="url(#led-gold)" filter="url(#glow)"/>
  <rect x="115" y="121" width="20" height="26" rx="2" fill="#1a1a1a" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <rect x="140" y="121" width="20" height="26" rx="2" fill="#1a1a1a" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <circle cx="125" cy="125" r="2" fill="url(#led-green)" filter="url(#glow)"/>
  <circle cx="150" cy="125" r="2" fill="url(#led-green)" filter="url(#glow)"/>
  <!-- Network switch style -->
  <rect x="168" y="121" width="112" height="26" rx="2" fill="#111" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <rect x="172" y="125" width="10" height="6" rx="1" fill="#0a0a0a" stroke="rgba(79,195,247,0.3)" stroke-width="0.5"/>
  <rect x="186" y="125" width="10" height="6" rx="1" fill="#0a0a0a" stroke="rgba(79,195,247,0.3)" stroke-width="0.5"/>
  <rect x="200" y="125" width="10" height="6" rx="1" fill="#0a0a0a" stroke="rgba(152,195,121,0.4)" stroke-width="0.5"/>
  <rect x="214" y="125" width="10" height="6" rx="1" fill="#0a0a0a" stroke="rgba(152,195,121,0.4)" stroke-width="0.5"/>
  <rect x="228" y="125" width="10" height="6" rx="1" fill="#0a0a0a" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
  <rect x="242" y="125" width="10" height="6" rx="1" fill="#0a0a0a" stroke="rgba(255,255,255,0.15)" stroke-width="0.5"/>
  <circle cx="176" cy="136" r="2" fill="url(#led-green)" filter="url(#glow)"/>
  <circle cx="190" cy="136" r="2" fill="url(#led-green)" filter="url(#glow)"/>
  <circle cx="204" cy="136" r="2" fill="url(#led-blue)" filter="url(#glow)"/>
  <circle cx="218" cy="136" r="2" fill="url(#led-blue)" filter="url(#glow)"/>
  <circle cx="232" cy="136" r="2" fill="url(#led-green)" filter="url(#glow)"/>
  <circle cx="246" cy="136" r="2" fill="url(#led-gold)" filter="url(#glow)"/>

  <!-- ── SERVER UNIT 3 ── -->
  <rect x="88" y="160" width="184" height="38" rx="2" fill="url(#srv1)"/>
  <rect x="88" y="160" width="184" height="38" rx="2" stroke="rgba(255,255,255,0.06)" stroke-width="0.5"/>
  <path d="M88 160 L106 148 L290 148 L272 160Z" fill="url(#srv1top)"/>
  <path d="M272 160 L290 148 L290 186 L272 198Z" fill="url(#srv1side)"/>
  <path d="M90 162 L270 162" stroke="rgba(255,255,255,0.06)" stroke-width="0.5" fill="none"/>
  <circle cx="102" cy="179" r="6" fill="#1e1e1e" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <circle cx="102" cy="179" r="3" fill="url(#led-green)" filter="url(#glow)"/>
  <!-- Storage display -->
  <rect x="115" y="167" width="157" height="24" rx="2" fill="#111" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
  <text x="120" y="177" font-family="monospace" font-size="5" fill="rgba(212,175,55,0.8)">STORAGE  /  2.4TB  /  8TB</text>
  <!-- Storage bar -->
  <rect x="120" y="180" width="140" height="5" rx="2" fill="rgba(255,255,255,0.07)"/>
  <rect x="120" y="180" width="42"  height="5" rx="2" fill="url(#led-gold)" opacity="0.7"/>

  <!-- ── SERVER UNIT 4 (monitoring) ── -->
  <rect x="88" y="206" width="184" height="38" rx="2" fill="#111"/>
  <rect x="88" y="206" width="184" height="38" rx="2" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
  <path d="M88 206 L106 194 L290 194 L272 206Z" fill="#1a1a1a"/>
  <path d="M272 206 L290 194 L290 232 L272 244Z" fill="#0a0a0a"/>
  <circle cx="102" cy="225" r="6" fill="#1e1e1e" stroke="rgba(255,255,255,0.1)" stroke-width="0.5"/>
  <circle cx="102" cy="225" r="3" fill="url(#led-blue)" filter="url(#glow)"/>
  <!-- Mini chart display -->
  <rect x="115" y="213" width="157" height="24" rx="2" fill="#0d0d0d" stroke="rgba(79,195,247,0.1)" stroke-width="0.5"/>
  <!-- Chart bars -->
  <rect x="122" y="228" width="5" height="5" rx="1" fill="rgba(79,195,247,0.4)"/>
  <rect x="130" y="223" width="5" height="10" rx="1" fill="rgba(79,195,247,0.5)"/>
  <rect x="138" y="220" width="5" height="13" rx="1" fill="rgba(212,175,55,0.5)"/>
  <rect x="146" y="225" width="5" height="8" rx="1" fill="rgba(79,195,247,0.4)"/>
  <rect x="154" y="218" width="5" height="15" rx="1" fill="rgba(212,175,55,0.6)"/>
  <rect x="162" y="221" width="5" height="12" rx="1" fill="rgba(79,195,247,0.4)"/>
  <rect x="170" y="214" width="5" height="19" rx="1" fill="rgba(152,195,121,0.5)"/>
  <rect x="178" y="222" width="5" height="11" rx="1" fill="rgba(79,195,247,0.4)"/>
  <!-- Metric text -->
  <text x="192" y="222" font-family="monospace" font-size="5" fill="rgba(152,195,121,0.8)">99.9%</text>
  <text x="192" y="230" font-family="monospace" font-size="4" fill="rgba(255,255,255,0.4)">uptime</text>
  <rect x="232" y="215" width="34" height="22" rx="2" fill="rgba(255,255,255,0.02)"/>
  <text x="235" y="223" font-family="monospace" font-size="4" fill="rgba(79,195,247,0.7)">NGINX OK</text>
  <text x="235" y="231" font-family="monospace" font-size="4" fill="rgba(152,195,121,0.7)">API  OK</text>

  <!-- Cable wires at bottom -->
  <path d="M150 246 Q155 265 148 280" stroke="rgba(212,175,55,0.3)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M165 246 Q162 265 170 280" stroke="rgba(79,195,247,0.25)" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M180 246 Q183 265 178 280" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <path d="M195 246 Q198 262 192 280" stroke="rgba(152,195,121,0.2)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Power strip at bottom -->
  <rect x="88" y="258" width="184" height="14" rx="2" fill="#111" stroke="rgba(255,255,255,0.04)" stroke-width="0.5"/>
  <path d="M88 258 L106 246 L290 246 L272 258Z" fill="#181818"/>
  <path d="M272 258 L290 246 L290 272 L272 272Z" fill="#0a0a0a"/>
  <circle cx="108" cy="265" r="3" fill="url(#led-green)" filter="url(#glow)"/>
  <circle cx="120" cy="265" r="3" fill="url(#led-green)" filter="url(#glow)"/>
  <circle cx="132" cy="265" r="3" fill="url(#led-gold)" filter="url(#glow)"/>
  <circle cx="144" cy="265" r="3" fill="url(#led-green)" filter="url(#glow)"/>
  <circle cx="156" cy="265" r="3" fill="url(#led-green)" filter="url(#glow)"/>

  <!-- Floating tags above -->
  <rect x="20"  y="20" width="68" height="22" rx="3" fill="rgba(212,175,55,0.1)" stroke="rgba(212,175,55,0.3)" stroke-width="0.5"/>
  <text x="27" y="34" font-family="monospace" font-size="8" fill="rgba(212,175,55,0.9)">Ubuntu 24.04</text>

  <rect x="260" y="14" width="72" height="22" rx="3" fill="rgba(79,195,247,0.08)" stroke="rgba(79,195,247,0.25)" stroke-width="0.5"/>
  <text x="268" y="28" font-family="monospace" font-size="8" fill="rgba(79,195,247,0.9)">Docker +SSL</text>
</svg>
